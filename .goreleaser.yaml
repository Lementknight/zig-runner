# GoReleaser: the release's binaries and checksums, built from the tag the version workflow pushed,
# and the GitHub release that carries them with changie's notes (release.yml, README "Pipeline").
#
#   goreleaser release --snapshot --clean   # build everything into dist/, publish nothing
version: 2

project_name: zig-runner

builds:
  - id: runner
    builder: zig
    dir: runner
    binary: runner
    targets:
      - x86_64-linux-musl
      - aarch64-linux-musl
    flags:
      - -Doptimize=ReleaseSafe
      - -Dstrip
      # The tag, not `git describe`: the authoritative name for the build.
      - -Dversion={{ .Tag }}

# The bare binaries, under the names releases have always used.
archives:
  - formats: [binary]
    name_template: >-
      zig-runner-linux-{{ if eq .Arch "amd64" }}x86_64{{ else }}aarch64{{ end }}

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# release.yml passes changie's notes for the version; this is for a tag cut without them.
changelog:
  use: github-native

# A draft until release.yml has attested the binaries and attached the SBOM and the attestations:
# published, a release is immutable (the repository's immutable releases), so it must be complete
# first. A rerun replaces a draft left by a failed run instead of adding a second.
release:
  name_template: "{{ .Tag }}"
  draft: true
  replace_existing_draft: true
