kind: Fixed
body: 'An `action.yml` with flow collections nested 100000 deep (`[[[…`) crashed the runner; past 64 levels they are now refused as unsupported. `Null` and `NULL` read as null, as YAML 1.2 reads them (only `null` and `~` did), and an explicit key in a flow mapping (`{? key : value}`) is refused instead of misread. Found by comparing the YAML reader with Go''s go.yaml.in/yaml/v3 on 188 action.yml files from popular actions (all read the same) and 10000 random files.'
time: 2026-10-26T23:30:00.000000-04:00
