kind: Fixed
body: 'More expressions evaluate as on GitHub, found by comparing 100000 random expressions with Gitea''s evaluator and settling each difference against GitHub''s source: `true`, `false`, `null`, `NaN` and `Infinity` are keywords only spelled so (`TRUE` is an unknown name); only a context, a function''s result or a parenthesised expression can be indexed (`''abc''[0]` is an error); `1E-2` is one number token; a fractional index is rounded down; `a >= a` is true for arrays and objects; `contains`, `startsWith` and `endsWith` are false for an array or object argument; `toJSON` writes NaN and Infinity as `null`; `case()` evaluates all its arguments, as every function does; and a `*` filter''s result stays a filter through a function (`case(c, a.*, b.*).name`).'
