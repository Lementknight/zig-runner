kind: Fixed
body: 'Four behaviours now match GitHub''s runner (#214). A step''s own `env:` no longer changes the variables GitHub sets again over it (`GITHUB_SHA`, `RUNNER_TEMP`, `GITHUB_ACTIONS` and the rest), in the process; `${{ env.X }}` still reads the step''s value. A step failed only by a workflow or file command (a refused `::set-env`, a malformed `$GITHUB_OUTPUT`) no longer also logs "Process completed with exit code 1.". In a composite action''s `run:` steps, a `shell:` or `working-directory:` expression that cannot be evaluated fails the step instead of being used as written. A `::` command keeps trailing whitespace in its data, and its property names match in any case (`FILE=`, `Title=`), with the last of a name winning.'
