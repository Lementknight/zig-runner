kind: Security
body: 'tls.zig, the one package compiled into the runner, is now checked against its `.hash` in `build.zig.zon` by CI''s tests and the release''s binaries too, which fetch it with git rather than `zig build`; Renovate proposes new tls.zig commits and new commits of GitHub''s expression test cases. The README, THIRD_PARTY.md, BENCHMARKS.md and the deployment files describe the pipeline as it now is (daily releases, the `automerge` workflow, the Lean proofs, the weekly comparisons) and link the deployment guide and specification in Lementknight/zig-actions-runner.'
