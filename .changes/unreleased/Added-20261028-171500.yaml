kind: Added
body: 'The memory gate also holds on the Dagger engine container''s own memory cap and swap (#142): razorbill''s engine filled its 4 GB cap and swapped while the host still showed 2 GB available. The runner finds the engine''s cgroup through the process listening on its unix socket, with no Docker access, and logs which one, or why it could not, in which case it holds on the host''s memory only. New settings: `RUNNER_MIN_ENGINE_HEADROOM_MB` (256) and `RUNNER_ENGINE_CGROUP`.'
