kind: Fixed
body: '`::stop-commands::` behaves as on GitHub (#103): the line that stops commands and the one that resumes them are both logged, a token longer than six characters is masked, the resume line matches in any case, a token that is empty, `pause-logging` or a command''s name fails the step unless `ACTIONS_ALLOW_UNSECURE_STOPCOMMAND_TOKENS` is true, and a pause ends with the step (or composite step) that started it.'
