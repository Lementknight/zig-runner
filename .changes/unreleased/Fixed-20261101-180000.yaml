kind: Fixed
body: 'The native step store, after review: a rootfs provisioned again in place is noticed (the rootfs''s fingerprint now covers ctimes and inodes, and every job checks the root and a `.zig-runner-provisioned` stamp the recipe touches); the store''s format is in every key, so layers do not outlive a runner upgrade that changes their meaning; a vouched fork''s pull request keys its layers apart from its repository''s jobs (the package caches'' scope); a record that cannot be replayed is refused at publish, and a stored entry is checked whole on every hit (lengths and sha256s in a `meta`) and evicted when it is not; entries are synced to disk before the rename that publishes them; a lock is not leaked on an error, and an upper that cannot be put back is never deleted; a layer''s size is counted with no depth limit and a layer that cannot be counted whole is not published.'
