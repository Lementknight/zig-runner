kind: Added
body: 'A native step backend, behind `RUNNER_BACKEND=native` (the default stays `dagger`): a job whose steps are `run:` scripts and the built-in checkout, on the default image, runs its steps in the runner itself, each in a sandbox of its own (an overlay on the layers the steps before it left, private mount, PID, UTS and IPC namespaces, chroot), rootless through a user namespace when the runner is not root. Steps get the same script, env, file commands, masks, live log, conditions, timeouts and cancellation as on Dagger, through the same code. A job that uses anything native cannot do yet (`container:`, `services:`, `uses:` actions, a custom image, submodules, a job the runner does not vouch for) runs on Dagger, and "Set up job" says why. The rootfs is a provisioned `ubuntu:24.04` directory (`RUNNER_NATIVE_ROOTFS`) until the native image pull; layers go to `RUNNER_NATIVE_STORE`. On the laptop, a trivial step takes 18 ms against about 224 ms on Dagger. docs/native-backend.md has the privileges it needs and what it taught.'
