kind: Added
body: 'A native step backend, behind `RUNNER_BACKEND=native` (the default stays `dagger`): a job whose steps are `run:` scripts and the built-in checkout, on the default image, runs its steps in the runner itself, through the same code for scripts, env, file commands, masks, live logs, conditions, timeouts and cancellation as on Dagger. On a root runner each job gets a range of host ids of its own (`RUNNER_NATIVE_SUBID_BASE`; its root and runner user are nobody on the host) and a network namespace of its own on the runner''s bridge `zr0` with NAT (its own `lo` and ports, no reach to the host''s loopback); each step gets a fresh overlay, mount, PID, UTS and IPC namespaces, `pivot_root`, runc''s masked `/proc`, Docker''s default capabilities, `no_new_privs` and a seccomp deny list. It is not yet a boundary for untrusted jobs: no cgroup limits, and native runs only jobs the runner vouches for. A rootless runner sends jobs to Dagger unless `RUNNER_NATIVE_ROOTLESS=1`. Anything native cannot do yet (`container:`, `services:`, `uses:` actions, a custom image, `hashFiles()`, submodules) runs on Dagger, and "Set up job" says why. The rootfs is a provisioned `ubuntu:24.04` directory (`RUNNER_NATIVE_ROOTFS`) until the native image pull. On the laptop a trivial step takes 33 ms against about 224 ms on Dagger. docs/native-backend.md has what the runner needs and what this taught.'
