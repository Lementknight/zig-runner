kind: Added
body: 'A native step backend, behind `RUNNER_BACKEND=native` (the default stays `dagger`): a job whose steps are `run:` scripts and the built-in checkout, on the default image, runs its steps in the runner itself, through the same code for scripts, env, file commands, masks, live logs, conditions, timeouts and cancellation as on Dagger. On a root runner each job gets a range of host ids of its own (`RUNNER_NATIVE_SUBID_BASE`; its root and runner user are nobody on the host) and a network namespace of its own on the runner''s bridge `zr0` with NAT (`RUNNER_NATIVE_SUBNET`, by default 10.211.0.0/16: its own `lo` and ports, no reach to the host''s services or to other jobs); slots are locked host-wide under `/run/zig-runner`, which a systemd unit needs as `RuntimeDirectory=zig-runner` with `RuntimeDirectoryPreserve=yes`; each step gets a fresh overlay, mount, PID, UTS and IPC namespaces, `pivot_root`, runc''s masked and read-only `/proc` (a mask that cannot be applied fails the step), Docker''s default capabilities, a seccomp deny list (io_uring refused, `personality` limited to Docker''s values), and `no_new_privs` (but for the runner user on a root runner, whose sudo reaches only the job''s own root). It is not yet a boundary for untrusted jobs: no cgroup limits, and native runs only jobs the runner vouches for. A rootless runner sends jobs to Dagger unless `RUNNER_NATIVE_ROOTLESS=1`. Anything native cannot do yet (`container:`, `services:`, `uses:` actions, a custom image, `hashFiles()`, submodules) runs on Dagger, and "Set up job" says why. The rootfs is a provisioned `ubuntu:24.04` directory (`RUNNER_NATIVE_ROOTFS`) until the native image pull. On the laptop a trivial step takes 33 ms against about 224 ms on Dagger. docs/native-backend.md has what the runner needs and what this taught.'
