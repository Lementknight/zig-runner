kind: Fixed
body: 'With step caching (the default), a step that read the event payload without naming `GITHUB_EVENT_PATH` (a script in a file reading a `workflow_dispatch` input, say) could be replayed with an earlier run''s payload. Such a step is now given the JSON string `"zig-runner-withheld"` there instead, as it is given that constant for the run-specific variables, so reading a field fails visibly; a step whose script names `GITHUB_EVENT_PATH` or `/github/workflow/event.json` runs every time and gets the real payload. `RUNNER_ENFORCE_VOLATILE=false` restores GitHub''s behaviour.'
time: 2026-10-27T09:00:00.000000-04:00
