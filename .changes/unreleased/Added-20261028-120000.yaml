kind: Added
body: 'A memory gate (#126): a runner asks GitHub for a job only while the machine has the memory for it, reserving room for the jobs its pool''s other runners may be handed at the same moment and for jobs started in the last two minutes, and holds while memory pressure (PSI) or swap growth says the machine is struggling. A held runner removes its registration and waits, logging once when it holds and once when it resumes; running jobs are never touched. On by default (RUNNER_ADMISSION, RUNNER_MIN_MEM_AVAILABLE_MB=1536, RUNNER_MEM_PER_JOB_MB=1024, RUNNER_MAX_MEM_PRESSURE=10, RUNNER_MAX_SWAP_GROWTH_MB=64), which on razorbill lets three heavy jobs start together from idle, not four. The README and compose.yaml also describe giving the engine no swap of its own (memswap_limit equal to mem_limit), and its trade-off.'
