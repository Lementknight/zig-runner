kind: Changed
body: 'Less time between a job''s last step and the runner listening for the next one: the next runner''s token and broker session are made in the background with its registration, while the job finishes, so the next cycle polls at once (about 0.2 s, the token and session, off the path); each step''s log is uploaded as the step finishes, as GitHub''s runner does, leaving the job''s end with "Set up job", "Complete job" and the job''s whole log; the live view''s last update is sent while the logs upload rather than after; and the job-hold renewer is stopped at once instead of after its current 50 ms wait. Every log is still up (or reported failed) before completejob, a step that logged after its upload or whose upload failed is uploaded again at the end, and a session no cycle takes over is deleted with its registration.'
