kind: Security
body: 'The default job image, the shared base of every job across trust scopes, is pinned by its Docker Hub multi-arch index digest (`ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852`, one pin for amd64 and arm64) instead of the moving tag the pre-warm rebuilt from at every boot. Renovate moves the pin monthly and CI''s `ubuntu-pin.sh` checks it. After upgrading, every step re-keys once, because the base image''s identity changes, and runs once more; the tool cache keeps its volume, as it is keyed by the image''s name. A config or `container:` naming `ubuntu:24.04` gets the pinned, provisioned image; another digest is used as is. Provisioning''s apt packages still come from the archive on the build date (`pkg=version` pins vanish from noble-updates within weeks, and snapshot.ubuntu.com does not serve arm64), so the pre-warm''s line now names the provisioned seed by a fingerprint of its installed packages.'
time: 2026-10-31T23:59:00.000000-04:00
