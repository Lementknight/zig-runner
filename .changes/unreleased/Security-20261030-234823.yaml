kind: Security
body: 'The deploy agent (`deploy/zig-runner-deploy`) refuses downgrades and retries what fails for a reason of the moment (#106). A deployment of a version older than the one installed is reported failed unless `ALLOW_DOWNGRADE` in `/etc/zig-runner-deploy.env` names that version, so whoever can create a deployment can no longer roll razorbill back to an older, genuinely attested release. A download, attestation or Sigstore trust-root fetch that fails with no network, a rate limit or a timeout no longer marks the deployment failed for good: the agent reports nothing and the timer tries again each minute, up to `ATTEMPTS` (30) tries counted in its state directory. Provenance is then verified offline, so a checksum or provenance mismatch, or a missing release or attestation, still fails at once. Upgrade: install the new `zig-runner-deploy` on the machine.'
