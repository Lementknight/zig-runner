kind: Added
body: 'The runner pre-warms the engine in the background (`RUNNER_PREWARM`, on by default): it builds the default image''s provisioned base container, and the Zig cache seed with `RUNNER_ZIG_SEED`, with no job, when the pool starts, when the engine starts again (seen by the memory gate''s engine detector where the engine''s cgroup is visible, else by its unix socket appearing or being replaced) and after a job that had to wait for the engine. The documents are written by the job''s own writers, so the engine answers the first job from its cache: on the laptop that job had spent 169 s in "Set up job" after an engine wipe. The warm takes a memory-gate slot of its own once the engine accepts its session, mounts no volume, logs `pre-warm: base container ... built in N s (<image@digest>)`, can be cancelled by a stop, and never fails or blocks a job. Skipped with `RUNNER_ENGINE=cli` and when the runner trusts no ref.'
