kind: Fixed
body: 'A job''s memory no longer grows with every line its steps print: problem matchers (setup-node''s `tsc` matcher took 18.8 GB over a million ordinary lines), lines containing `::`, and the log collector, which kept a copy of every line past its 64 MB cap and of every spooled one, now keep only what outlives the line. `::add-mask::` costs memory in proportion to the number of masks rather than its square (20000 masks took 5.8 GB, now 7 MB), and masking a line no longer slows down with the number of masks.'
time: 2026-10-28T05:00:00.000000-04:00
