kind: Fixed
body: 'Release re-runs and image rebuilds (#106). "Re-run all jobs" after the release was published no longer fails at creating it again: the binaries job checks the published release is complete and attested for its tag, and leaves it alone, so the image and the deploy run. Rebuilding a tag''s image by hand now waits for approval in `prod` (so only from `main`), refuses tags before v0.14.0, whose Dockerfile has no `prebuilt` stage, and moves `latest` only for the newest version tag. A tag''s push and a rebuild of the same tag share one concurrency group, so they cannot push its image at once. The release checks the binaries'' provenance as razorbill does (`--source-ref refs/tags/<tag> --deny-self-hosted-runners`), as do the README''s commands. A release with no changelog entries (Renovate''s alone) gets GitHub''s generated notes instead of a bare heading.'
