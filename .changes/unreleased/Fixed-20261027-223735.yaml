kind: Fixed
body: 'A problem matcher''s regular expression can no longer take gigabytes of memory or seconds per log line: a large group number (`(?<100000000>a)`, 7 GB) or thousands of groups with a lookahead (4.4 GB) now cost what a few groups do, and a long backreference counts against the step budget by the characters it compares (`(?i)(.*)\1b` took 2 s on a 30 KB line, now 20 ms).'
time: 2026-10-27T22:37:35.000000-04:00
