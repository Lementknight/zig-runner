kind: Security
body: 'The image is built and scanned with fewer privileges and pinned tools (#106). The "Image" check (pull requests, the merge queue, tags) now only reads; pushing and attesting the image moved to a new job, "Image (publish)", which runs only on a tag or a rebuild by hand and alone holds `packages`, `id-token` and `attestations` write. BuildKit (`moby/buildkit`) and its SBOM scanner (`docker/buildkit-syft-scanner`) are pinned by digest, followed by Renovate, instead of the moving `buildx-stable-1` and `stable-1` tags. Trivy''s vulnerability database is fetched once, with retries, from `mirror.gcr.io` first and then `ghcr.io`, so a rate-limited fetch no longer leaves a published release without an image or a deployment.'
