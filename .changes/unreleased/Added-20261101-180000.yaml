kind: Added
body: 'An end-to-end check before merge ("End to end" in ci, `.github/scripts/e2e.sh`): the runner built from the pull request serves real workflows on GitHub''s runner, through GitHub''s broker and the pinned Dagger engine, once on Dagger and once with `RUNNER_BACKEND=native`. It registers just-in-time runners on Open-Blue/runner-bench under a label of the run''s own (as the GitHub App `zig-runner-e2e`, whose key only the `e2e` environment holds, so fork pull requests skip it, still reporting), dispatches runner-bench''s `e2e.yml` and `e2e-cancel.yml`, and checks jobs, steps and logs through the API: a script installing into the tool cache (what v0.22.0 broke), a service, a `docker://` step, a JavaScript action, the file commands, a masked secret, a cancelled run, and a rerun replayed from the step cache. Each job''s times on both backends go to the `e2e-timings` artifact. `e2e.sh check <label>` runs the same suite by hand against a running pool, in place of the manual smoke test before a release. `zig-runner --provision-script` prints the script that provisions the default image, for making the native backend''s rootfs. Not a required check yet.'
