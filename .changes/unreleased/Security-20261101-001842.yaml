kind: Security
body: 'Zig''s global cache is no longer shared between jobs, and seeding it is on by default, from signature-verified Zig releases. Zig runs the compiled outputs it finds in `o/` without checking them, so one compromised job in a trust scope could plant a binary or object that every later Zig job in that scope linked or ran. Each job now gets the seed as a directory of its own container, or an empty cache without one, and what it writes there is gone when it ends. Only the package tarballs (`p/`), which Zig hashes again when it unpacks them, stay shared, in a new volume (`.../zig-packages`). The runner seeds the releases in `RUNNER_ZIG_SEED_VERSIONS` (by default the Zig it is built with) and the Zig versions its tool-cache check finds in `repo` jobs'' tool caches, at most 3 in all. Before seeding from one it checks each tarball''s minisign signature and trusted comment natively against Zig''s pinned public key, and a release that does not verify is not seeded, which "Set up job" says. `RUNNER_ZIG_SEED=<version>=<sha256>` still pins one release by digest. Zig''s local cache volume (`RUNNER_ZIG_LOCAL_CACHE`) is now kept only for `repo` jobs; an untrusted job''s is its own, and "Set up job" says so.'
