kind: Changed
body: 'Fewer round trips to the Dagger engine per job, with the same results and, by default, the same cache keys (with the experimental output keys on, output-keyed steps run once more after upgrading): a secret is registered once per job however many steps use it (the job token reached every action phase, a step''s secret env every step), and secrets first needed together are registered in one query; "Set up job" registers the secrets the job will need in the cache volumes'' query, which also asks for the output-key store; an action used by several steps (or composite actions) is fetched once; the files of several `::add-matcher::` commands are read in one query; and output keys read the container before an always-run step in that step''s own query, and ask for the store with busybox. A job with a JavaScript action in two steps sends 9 queries instead of 18, each always-run step with a secret under output keys 4 instead of 6 after the first.'
