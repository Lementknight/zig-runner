kind: Fixed
body: '`hashFiles()` now finds files exactly as GitHub''s does and gives the same hash: its search is @actions/glob (what GitHub''s runner runs it with, on Node) ported to Zig, reading the job''s container through Dagger''s API instead of Dagger''s glob. Files are hashed in GitHub''s order (depth-first, each directory''s entries in byte order), so with several files the result is GitHub''s hash too, where it differed before. Every pattern feature @actions/glob has works (classes, POSIX classes, escapes, `~`), and unknown `--` options are refused as GitHub refuses them. `--follow-symbolic-links` is refused for now: it needs canonical paths, which Dagger''s API does not give.'
