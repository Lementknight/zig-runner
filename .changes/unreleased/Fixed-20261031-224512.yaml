kind: Fixed
body: 'Install Zig no longer re-reads the cached Zig tree (19,500 files, 309 MB; 10-19 s on razorbill under load) when the runner has already checked it. In "Set up job", before any step runs, the runner checks every tree in the tool cache (TOOL/VERSION/NAME). It re-hashes only the files whose size, inode, mtime or ctime changed, using lists kept in a volume that no step ever mounts, so a job cannot forge them. It then gives steps each tree''s path and digest in `ZIG_RUNNER_TOOL_TREES`, and install-zig.sh skips its own check only when that variable names its tree with the pinned digest. Anything else means the full check, as on GitHub''s runners. The check is skipped in jobs that have Dagger nesting, whose steps could reach the volume, and `RUNNER_TOOL_TREES=false` turns it off.'
