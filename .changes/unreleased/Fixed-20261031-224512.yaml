kind: Fixed
body: 'Install Zig re-reads only the files of the cached Zig tree whose size, inode, mtime or ctime changed since the last check passed, from a list of their stat lines and hashes kept beside the tree, instead of all 19,500 files (309 MB) on every job; a missing, unreadable or mismatched list, or a digest that does not match, means the full check. On the laptop the check takes 0.4-0.5 s against 0.8-1 s warm. A job that rewrites both a file and its line in the list is no longer caught; set `ZIG_TREE_FULL=1` or delete the list to re-read everything.'
