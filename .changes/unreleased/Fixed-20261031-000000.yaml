kind: Fixed
body: 'An engine that vanishes or stops answering no longer holds up a job for good (#100): connections to a remote engine (`RUNNER_ENGINE_HOST=tcp://`) have TCP keepalive, so a host that went away is noticed in about 90 s, and the session''s `/shutdown` at the end of a job is given up after 10 s.'
