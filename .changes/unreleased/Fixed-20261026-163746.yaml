body: 'A database that is slow or stops answering no longer holds up jobs: log lines and run-state rows are written by background tasks, never on a job''s path. With the database paused for 60 s, jobs on 4 runners took 69-70 s instead of 17-19 s; now 16-17 s, and every line and row still reaches it.'
