kind: Added
body: 'The Lean proofs cover the native step store (P8 of docs/native-backend.md): `Runner.Native` proves that the native key, the parent''s key, the script and the stable environment spelt with length-prefixed fields and sha256 of that, keeps exactly what the model''s key keeps (mounts, volatile variables and the event payload stay out); that a job run against a store other runners share, which records only successes of unmarked steps, produces what it does with the step cache off, under the same hypothesis as on Dagger and whatever other runners publish or evict and whichever reads fail; that which of two racing writers wins does not matter; that an entry must be read whole or be a miss; and what a layer digest must hash (a sorted walk, nothing that differs between runs) for output keys. `keyoracle` writes the key vectors runner/src/native/key_vectors.zig checks the Zig key against, until P2''s store takes its place there.'
