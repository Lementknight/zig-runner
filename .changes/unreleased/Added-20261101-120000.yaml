kind: Added
body: 'Native steps (`RUNNER_BACKEND=native`) get cache volumes, a cgroup per job and the memory gate''s per-job accounting. The package caches, the tool cache, Zig''s package tarballs and local cache (with its generations), uv''s environment and the minisign-verified Zig cache seed work as on Dagger: host directories under the native store bound into every step, never part of a step''s layers, with the `repo` and `untrusted` scopes as separate trees and Dagger''s sharing modes kept with flock (shared by default); on a root runner a volume''s files are owned by a range of ids of its own, past the slots'', and each job sees them as its own through an idmapped mount, nosuid and nodev. Each native job runs in a cgroup v2 of its own with `memory.max` (`RUNNER_NATIVE_MEMORY_MAX_MB`, by default three quarters of the machine''s memory) and `pids.max` (`RUNNER_NATIVE_PIDS_MAX`, by default 8192), so a runaway job is OOM-killed in its own cgroup and a fork bomb stops at its own limit, and the step''s log says when it hit either. The cgroups go under `/sys/fs/cgroup/zig-runner` on a root runner, or in a cgroup delegated to the runner (`RUNNER_NATIVE_CGROUP=self`, under `Delegate=yes` or `systemd-run --user --scope -p Delegate=yes`); without one a native job runs as before, and "Set up job" says why. The memory gate measures a native job in its own cgroup instead of the Dagger engine''s, so two overlapping jobs are no longer charged for each other: holding 300 MB each, the first measured 304 MB against 610 MB engine-wide.'
