kind: Added
body: 'Native image pull (phase 3 of the native step backend, behind `RUNNER_BACKEND=native`): the runner pulls a job''s image itself, a Zig port of the registry protocol with token auth and a `container:` job''s `credentials:`, an index narrowed to linux/amd64 or arm64, gzip and zstd layers, whiteouts and opaque directories, blobs checked against their digests and kept content-addressed, and every layer unpacked inside the rootfs and nowhere else (no `..`, no symlink or hard link out, device nodes left out). The default image is provisioned by a native step on it, keyed by the image, the script and its env and kept in the store, so no Dagger session is needed to make the rootfs and `RUNNER_NATIVE_ROOTFS` is now optional. `container:` jobs and any image run natively (a job container''s `ports:`, `volumes:` and `options:` still go to Dagger), with the image''s env and `USER`, and "Set up job" says how the image and its provisioning were got. The Dagger backend is unchanged.'
