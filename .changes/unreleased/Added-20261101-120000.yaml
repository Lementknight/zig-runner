kind: Added
body: 'Native steps get the step cache: a layer store (`native/Store.zig`) keeps each step''s layer, output and file commands under the model''s key (parent, script, stable env; P8''s preimage format), so a job run again replays unchanged steps from the store instead of running them, its log the live one''s byte for byte, its file commands applied again. Only a step that exited 0, uses no secret and follows a stored step is kept, so a failure is never replayed (#69) and no layer or log holds a secret; a commit''s checkout is kept like a step. Layers are published by one rename that never replaces, one flock per key keeps two jobs sharing the store from running one key twice, a job holds the layers it uses so eviction (least recently used first, past `RUNNER_NATIVE_STORE_MAX_MB`, by default 10240) never takes them, a stack past 100 layers is flattened with hard links, and a layer''s digest is deterministic (paths, modes, ids as the job sees them, xattrs, content). The store is mode 0700 (its layers hold files owned by the jobs'' ids). Native stays off by default; the Dagger backend is unchanged.'
