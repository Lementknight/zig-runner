body: 'A workflow or action file with a flow collection holding an entry that reads nothing (`a: [}]`, `{]}`, `[1, , 2]`) no longer makes the runner allocate until it runs out of memory: it is invalid YAML, as GitHub and Go''s YAML reader say. Found by the new fuzz tests.'
