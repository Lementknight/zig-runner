kind: Fixed
body: '`hashFiles()` selects the files GitHub''s does, checked against GitHub''s own script on @actions/glob: a pattern matching a directory brings in everything below it again (Dagger''s glob lists nothing for `src/*/**`, so `hashFiles(''src/*'')` missed the files in `src`''s subdirectories); a trailing `/` matches directories only (`*/` is every file in a subdirectory, not every file); a symbolic link to a directory is skipped instead of failing the step; and a `.` or `..` segment in a pattern is refused, as GitHub refuses it.'
