# Version: after a pull request merges into main, the next version from the merged branches'
# prefixes and labels (README, "Versioning"), then a release of it.
# main is protected, so the version goes in build.zig.zon on a commit just off main, which the tag
# names; only the tag is pushed. A tag pushed with this workflow's token starts no workflow, so
# this one calls the release itself.
name: version

on:
  pull_request:
    types: [closed]
    branches: [main]

# One run at a time. GitHub keeps one waiting run and drops any older one; that loses nothing,
# because each run releases all of main since the last tag, not just its own pull request.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.next.outputs.tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          sed -E -i "s/^([[:space:]]*\.version = )\"[^\"]*\"/\1\"${TAG#v}\"/" runner/build.zig.zon
          grep -q "\.version = \"${TAG#v}\"" runner/build.zig.zon
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
      packages: write
