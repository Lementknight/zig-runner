# Release: on a version tag (pushed by the version workflow), static runner binaries (x86_64 and
# aarch64 Linux) on a GitHub release, and the runner image (linux/amd64 and linux/arm64) on
# GitHub's container registry.
# On pull requests that touch the runner's packaging, only checks that the image builds.
# Run by hand with a tag to (re)build and push that tag's image.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag whose image to build and push (v0.1.0)"
        required: true
  pull_request:
    paths:
      - runner/Dockerfile
      - runner/build.zig
      - deploy/**
      - .github/workflows/release.yml

# Nothing by default; each job asks for what it needs.
permissions: {}

# One release of a tag at a time, run to the end.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # The tag released: pushed, or given by hand.
  TAG: ${{ inputs.tag || github.ref_name }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

jobs:
  binaries:
    name: Binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release and upload the binaries
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Zig
        run: .github/scripts/install-zig.sh

      - name: Build
        working-directory: runner
        run: |
          mkdir -p ../dist
          # The tag, not `git describe`: checkout fetches no tags, so a derived version would
          # silently be the package's own. This is the authoritative name for the build anyway.
          for arch in x86_64 aarch64; do
            zig build -Doptimize=ReleaseSafe -Dstrip -Dversion="$TAG" -Dtarget="${arch}-linux-musl" --prefix "/tmp/${arch}"
            cp "/tmp/${arch}/bin/runner" "../dist/zig-runner-linux-${arch}"
          done
          cd ../dist && sha256sum zig-runner-* > SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The version's changie notes; GitHub's own for a tag cut without them.
        run: |
          notes=(--generate-notes)
          [[ -f ".changes/$TAG.md" ]] && notes=(--notes-file ".changes/$TAG.md")
          gh release create "$TAG" dist/* --title "$TAG" "${notes[@]}" --verify-tag

  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the code
      packages: write # to push the image to ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Registry names must be lowercase; owners often are not (Lementknight).
      - name: Image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/zig-runner" >> "$GITHUB_ENV"

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build (and push, for a tag)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: runner
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          build-args: |
            VERSION=${{ env.TAG }}
          # A pull request's ref (`123/merge`) is no image tag; it builds under a local name.
          tags: ${{ env.PUBLISH == 'true' && format('{0}:{1},{0}:latest', env.IMAGE, env.TAG) || 'zig-runner:check' }}
