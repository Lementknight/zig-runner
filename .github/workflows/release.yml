# Release: on a version tag (pushed by the version workflow), static runner binaries (x86_64 and
# aarch64 Linux) on a GitHub release, built by GoReleaser (.goreleaser.yaml), and the runner image
# (linux/amd64 and linux/arm64) on GitHub's container registry. Both carry signed build provenance
# (`gh attestation verify`); the image is scanned by Trivy before it is pushed.
# On pull requests that touch the packaging, the same builds and scans, publishing nothing.
# Run by hand with a tag to (re)build and push that tag's image.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag whose image to build and push (v0.1.0)"
        required: true
  pull_request:
    paths:
      - runner/Dockerfile
      - runner/build.zig
      - deploy/**
      - .goreleaser.yaml
      - .trivyignore.yaml
      - .github/workflows/release.yml

# Nothing by default; each job asks for what it needs.
permissions: {}

# One release of a tag at a time, run to the end.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # The tag released: pushed, or given by hand.
  TAG: ${{ inputs.tag || github.ref_name }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
  GORELEASER_VERSION: v2.18.3
  # Trivy's own image; the digest is what is pinned, the tag says which release it is.
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  binaries:
    name: Binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to create the release and upload the binaries
      id-token: write # to sign the binaries' provenance with Sigstore
      attestations: write # to store that provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # GoReleaser reads the tag and the one before it
          persist-credentials: false

      - name: Install Zig
        run: .github/scripts/install-zig.sh

      # The version's changie notes; GoReleaser's GitHub-generated ones for a tag cut without them.
      - name: Release notes
        id: notes
        run: |
          if [[ -f ".changes/$TAG.md" ]]; then
            echo "args=--release-notes=.changes/$TAG.md" >> "$GITHUB_OUTPUT"
          fi

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # SHA256SUMS names every binary with its digest, so this covers each under its release name.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  # The pull request's check of the same build: everything into dist/, nothing published.
  binaries-check:
    name: Binaries (check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Zig
        run: .github/scripts/install-zig.sh

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean

  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code
      packages: write # to push the image to ghcr.io
      id-token: write # to sign the image's provenance with Sigstore
      attestations: write # to store that provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Registry names must be lowercase; owners often are not (Open-Blue).
      - name: Image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/zig-runner" >> "$GITHUB_ENV"

      - name: Scan the Dockerfile
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE" config \
            --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml runner/

      # Scanned before anything is pushed: one platform, loaded into the local Docker. The
      # publishing build below reuses its layers from this builder.
      - name: Build for the scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: runner
          platforms: linux/amd64
          load: true
          tags: zig-runner:scan
          build-args: |
            VERSION=${{ env.TAG }}

      - name: Scan the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed zig-runner:scan

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build (and push, for a tag)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: runner
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          # BuildKit's own provenance and SBOM, stored with the image in the registry.
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ env.TAG }}
          # A pull request's ref (`123/merge`) is no image tag; it builds under a local name.
          tags: ${{ env.PUBLISH == 'true' && format('{0}:{1},{0}:latest', env.IMAGE, env.TAG) || 'zig-runner:check' }}

      - name: Attest the image
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The release, recorded as a deployment to razorbill: the agent there (deploy/zig-runner-deploy)
  # installs it once its checksum and provenance check out, restarts the runners, and reports back
  # to the deployment (README, "Deploying releases"). Not on a run by hand, which rebuilds an image.
  deploy:
    name: Deploy to razorbill
    needs: [binaries, image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      deployments: write # to record the deployment
    steps:
      - name: Record the deployment
        env:
          GH_TOKEN: ${{ github.token }}
        # required_contexts: none: the release's checks already passed, before its tag existed.
        run: |
          jq -n --arg ref "$TAG" '{
            ref: $ref, environment: "razorbill", auto_merge: false, required_contexts: [],
            description: ("zig-runner " + $ref)
          }' | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - \
            --jq '"deployment \(.id): \(.ref) to \(.environment)"'
