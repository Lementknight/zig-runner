# Release: on a version tag (pushed by the version workflow), static runner binaries (x86_64 and
# aarch64 Linux) on a GitHub release, built by the compiler directly (build-binaries.sh: `zig build`
# would first spend about 100 s compiling Zig's build system, on runners whose cache is always
# empty), and the runner image (linux/amd64 and linux/arm64) on GitHub's container registry, made
# from those same binaries rather than a second build. Both carry signed build provenance
# (`gh attestation verify`), the binaries an attested SPDX SBOM too; the image is scanned by Trivy
# before it is pushed.
# On pull requests and in the merge queue, the same builds and scans, publishing nothing: required
# checks, which skip their steps, still reporting, on a change that cannot affect the packaging
# (ci-scope.sh packaging), as a path filter would not report at all.
# Run by hand with a tag to (re)build and push that tag's image, from its release's binaries: from
# main, once the maintainer approves it in the prod environment (which deploys only from main), and
# only for v0.14.0 or later (#93), whose Dockerfile has the `prebuilt` stage this builds. `latest`
# moves only for the newest version tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag, v0.14.0 or later, whose image to rebuild and push from its release's binaries"
        required: true
  pull_request:
  # The merge queue's runs; without this the required checks never report there.
  merge_group:

# Nothing by default; each job asks for what it needs.
permissions: {}

# One release of a tag at a time, run to the end, whether the tag's push or a run by hand started
# it (both by the tag's name, so they cannot push the same image tags at once); a pull request's new
# push replaces the checks of its old one, as in ci.yml.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The tag released: pushed, or given by hand.
  TAG: ${{ inputs.tag || github.ref_name }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
  # Trivy's own image; the digest is what is pinned, the tag says which release it is.
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  binaries:
    name: Binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to create the release and upload the binaries
      id-token: write # to sign the binaries' provenance with Sigstore
      attestations: write # to store that provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A re-run of the whole release after this job published it ("Re-run all jobs", for a failed
      # image or deploy) finds the release published, which cannot be created again: it checks
      # that every file is there and the binaries are the ones this workflow attested for the tag,
      # and leaves the release alone. The image and the deploy then run as on the first run.
      - name: Whether the release is published already
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ $(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null) == false ]]; then
            .github/scripts/release-binaries.sh --complete "$TAG" dist
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Zig
        if: steps.published.outputs.published == 'false'
        run: .github/scripts/install-zig.sh

      - name: Build
        if: steps.published.outputs.published == 'false'
        run: .github/scripts/build-binaries.sh "$TAG" dist

      # A draft until it is attested and complete (below). A draft a failed run left is replaced.
      # The version's changie notes, or GitHub's generated ones when they have no entries: changie
      # writes the version's heading regardless, so a release of Renovate's updates alone (which add
      # none) would otherwise say nothing.
      - name: Draft the release
        if: steps.published.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ $(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null) == true ]]; then
            gh release delete "$TAG" --yes
          fi
          if grep -qs '^\* ' ".changes/$TAG.md"; then notes=(--notes-file ".changes/$TAG.md"); else notes=(--generate-notes); fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" "${notes[@]}" \
            dist/zig-runner-linux-x86_64 dist/zig-runner-linux-aarch64 dist/SHA256SUMS

      # SHA256SUMS names every binary with its digest, so this covers each under its release name.
      - name: Attest the binaries' provenance
        if: steps.published.outputs.published == 'false'
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: SBOM
        if: steps.published.outputs.published == 'false'
        run: .github/scripts/sbom.sh "$TAG" dist/SHA256SUMS > dist/zig-runner.spdx.json

      - name: Attest the SBOM
        if: steps.published.outputs.published == 'false'
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/zig-runner.spdx.json

      # The release is published complete, before `deploy` asks razorbill
      # to download it (a draft's files are not public). The bundles verify offline:
      # `gh attestation verify BINARY --repo Open-Blue/zig-runner --bundle zig-runner.provenance.jsonl`.
      - name: Attach the SBOM and attestations, and publish
        if: steps.published.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" dist/zig-runner.provenance.jsonl
          cp "$SBOM_BUNDLE" dist/zig-runner.sbom.jsonl
          gh release upload "$TAG" --clobber \
            dist/zig-runner.spdx.json dist/zig-runner.provenance.jsonl dist/zig-runner.sbom.jsonl
          gh release edit "$TAG" --draft=false

  # The pull request's (and the merge group's) check of the same build: everything into dist/,
  # nothing published. The binaries go to the image check, with whether there are any (`run`);
  # binaries-zig-build checks them against `zig build`.
  binaries-check:
    name: Binaries (check)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the packaging
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh packaging

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/build-binaries.sh "$TAG" dist

      - name: SBOM
        if: steps.scope.outputs.run == 'true'
        run: |
          .github/scripts/sbom.sh "$TAG" dist/SHA256SUMS > "$RUNNER_TEMP/zig-runner.spdx.json"
          jq -e '.packages | length > 2' "$RUNNER_TEMP/zig-runner.spdx.json" > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.scope.outputs.run == 'true'
        with:
          name: binaries
          path: dist/
          retention-days: 1

  # The x86_64 binary build-binaries.sh makes must be byte for byte what `zig build` makes, so the
  # module graph it gives the compiler cannot drift from build.zig's. A job of its own, beside
  # binaries-check rather than after its build: `zig build` first compiles Zig's build system (about
  # 100 s on an empty cache), and the image check need not wait for that. Both builds here at once.
  binaries-zig-build:
    name: Binaries (same as zig build)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the packaging
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh packaging

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      - name: The same as zig build
        if: steps.scope.outputs.run == 'true'
        run: |
          .github/scripts/build-binaries.sh "$TAG" dist &
          direct=$!
          (cd runner && zig build -Doptimize=ReleaseSafe -Dstrip -Dtarget=x86_64-linux-musl \
            -Dversion="$TAG" --prefix "$RUNNER_TEMP/zig-build")
          wait "$direct"
          cmp "$RUNNER_TEMP/zig-build/bin/runner" dist/zig-runner-linux-x86_64

  # A run by hand pushes an image for a tag that is already released, so it waits for the
  # maintainer's approval in the prod environment, which also refuses a run from any branch but
  # main. The tag must be a version tag whose Dockerfile has the `prebuilt` stage (v0.14.0, #93,
  # and later): an earlier one would fail only after the approval, in the build.
  rebuild:
    name: Approve the image rebuild
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: prod
    permissions:
      contents: read # to read the tag's Dockerfile
    steps:
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version tag: $TAG"; exit 1; }
          dockerfile=$(gh api "repos/$GITHUB_REPOSITORY/contents/runner/Dockerfile?ref=refs/tags/$TAG" \
            -H 'Accept: application/vnd.github.raw') || { echo "::error::no tag $TAG with a runner/Dockerfile"; exit 1; }
          grep -qE '^FROM .* AS prebuilt$' <<<"$dockerfile" ||
            { echo "::error::$TAG's Dockerfile has no prebuilt stage: only v0.14.0 and later can be rebuilt"; exit 1; }

  # From the release's own binaries: a tag's, once the binaries job published them (checked against
  # SHA256SUMS and their provenance); a pull request's or merge group's from its check; by hand, the
  # tag's release, once the rebuild is approved. Each needed job is either skipped (binaries but on
  # a tag, binaries-check on one, rebuild but by hand) or must not have failed; by hand, the
  # rebuild must have been approved. A check that found the change cannot affect the packaging
  # built no binaries (`run` false): the steps skip, and the job still reports. `run` is empty on a
  # tag or by hand, where binaries-check is skipped, and everything runs.
  image:
    name: Image
    needs: [binaries, binaries-check, rebuild]
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure')
      && (github.event_name != 'workflow_dispatch' || needs.rebuild.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code, and download the release's binaries
      packages: write # to push the image to ghcr.io
      id-token: write # to sign the image's provenance with Sigstore
      attestations: write # to store that provenance
      artifact-metadata: write # to record the pushed image as the attestation's artifact
    env:
      RUN: ${{ needs.binaries-check.outputs.run != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          # A tag by name; a pull request or merge group by commit, not by its ref: the merge
          # queue deletes its temporary branch once the required checks pass, and this job can
          # still be starting then (it waits for the binaries), so fetching the branch failed.
          ref: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref) || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.RUN == 'true'

      - name: The pull request's binaries
        if: env.RUN == 'true' && env.PUBLISH != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist

      # Checked as razorbill checks them: against SHA256SUMS, and built by this workflow from the
      # tag on GitHub's own runners.
      - name: The release's binaries
        if: env.RUN == 'true' && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/release-binaries.sh "$TAG" dist

      # Where the Dockerfile's `prebuilt` stage takes them, by Docker's name for each architecture.
      - name: Into the build context
        if: env.RUN == 'true'
        run: |
          mkdir -p runner/prebuilt
          install -m 0755 dist/zig-runner-linux-x86_64 runner/prebuilt/runner-amd64
          install -m 0755 dist/zig-runner-linux-aarch64 runner/prebuilt/runner-arm64

      # Registry names must be lowercase; owners often are not (Open-Blue). `latest` is the newest
      # version tag's image: a rebuild of an older one leaves it where it is.
      - name: Image name
        if: env.RUN == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "IMAGE=ghcr.io/${OWNER,,}/zig-runner" >> "$GITHUB_ENV"
          if [[ $PUBLISH == true ]]; then
            newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' |
              sed -n 's|^refs/tags/\(v[0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' | sort -V | tail -n1)
            echo "newest version tag: $newest"
            echo "LATEST=$([[ $newest == "$TAG" ]] && echo true || echo false)" >> "$GITHUB_ENV"
          fi

      - name: Scan the Dockerfile
        if: env.RUN == 'true'
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE" config \
            --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml runner/

      # Scanned before anything is pushed: one platform, loaded into the local Docker.
      - name: Build for the scan
        if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner
          target: prebuilt
          platforms: linux/amd64
          load: true
          tags: zig-runner:scan

      - name: Scan the image
        if: env.RUN == 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed zig-runner:scan

      - name: Log in to the registry
        if: env.RUN == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build (and push, for a tag or by hand)
        id: build
        if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          # BuildKit's own provenance and SBOM, stored with the image in the registry.
          provenance: mode=max
          sbom: true
          # A pull request's ref (`123/merge`) or a merge group's is no image tag; it builds under a
          # local name.
          tags: >-
            ${{ env.PUBLISH == 'true' && format('{0}:{1}{2}', env.IMAGE, env.TAG,
            env.LATEST == 'true' && format(',{0}:latest', env.IMAGE) || '') || 'zig-runner:check' }}

      - name: Attest the image
        if: env.RUN == 'true' && env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The release, recorded as a deployment to razorbill: the agent there (deploy/zig-runner-deploy)
  # installs it once its checksum and provenance check out, restarts the runners, and reports back
  # to the deployment (README, "Deploying releases"). Not on a run by hand, which rebuilds an image.
  # Only once CI has passed on the tagged commit: the release commit, which version.yml pushes to
  # main with the deploy key, and which nothing checked before it was tagged (the merge queue
  # checked what merged, not the commit that adds the version and the changelog to it). That push,
  # unlike one with GITHUB_TOKEN, starts ci.yml's push run on the commit, at the same time as this.
  deploy:
    name: Deploy to razorbill
    needs: [binaries, image]
    # Explicit results, not the implicit success(): that also requires every job before these to
    # have succeeded, and on a tag "Binaries (check)", which the image job waits for, is skipped.
    # Without this, v0.14.0 was released and never deployed.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/')
      && needs.binaries.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    # The wait for the checks (WAIT_MINUTES), and a little.
    timeout-minutes: 45
    permissions:
      checks: read # to wait for the tagged commit's checks
      deployments: write # to record the deployment
    env:
      # What must have passed on the tagged commit, one per line: ci.yml's jobs that run on a push
      # to main (not "Branch name", pull requests' only, which is skipped here), and this run's
      # Binaries and Image, which this job needs, so they are done before it starts. A name that
      # never runs on a push to main would hold every deploy for the whole wait, then fail it.
      REQUIRED_CHECKS: |-
        Format, build and test
        Database tests
        Workflows
        Binaries
        Image
    steps:
      # ci.yml's build and tests run on prod, and are usually done before the image is; otherwise
      # this waits, up to WAIT_MINUTES. A check that completed without success fails the job at
      # once; one still queued or running at the end, or never started, fails it then. Each is
      # named. Only GitHub Actions' check runs count (another app could name one the same), from
      # every page, and for each name the latest (the highest id): a re-run is a new check run
      # under the same name. Once they pass, re-running this job deploys (README, "Deploying
      # releases").
      - name: Wait for the tagged commit's checks
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_MINUTES: "40"
        run: |
          mapfile -t checks <<<"$REQUIRED_CHECKS"
          deadline=$((SECONDS + WAIT_MINUTES * 60))
          while :; do
            runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.app.slug == "github-actions") | {id, name, status, conclusion}' |
              jq -s .) || {
              # A failed request counts as none found yet, so a passing GitHub hiccup costs a poll.
              echo "::warning::could not list the check runs on $GITHUB_SHA"
              runs='[]'
            }
            waiting=()
            for name in "${checks[@]}"; do
              state=$(jq -r --arg name "$name" '[.[] | select(.name == $name)] | max_by(.id)
                // {status: "missing"} | if .status == "completed" then .conclusion else .status end' <<<"$runs")
              case $state in
              success) ;;
              missing | queued | in_progress | waiting | requested | pending) waiting+=("$name ($state)") ;;
              *)
                echo "::error::$name: $state on $GITHUB_SHA, so $TAG is not deployed (README, \"Deploying releases\")"
                exit 1
                ;;
              esac
            done
            ((${#waiting[@]} > 0)) || break
            if ((SECONDS >= deadline)); then
              echo "::error::still waiting after $WAIT_MINUTES minutes for: ${waiting[*]}; $TAG is not deployed (README, \"Deploying releases\")"
              exit 1
            fi
            echo "waiting for: ${waiting[*]}"
            sleep 30
          done
          echo "passed on $GITHUB_SHA: ${checks[*]}"

      # required_contexts: none, because the step above is the check. GitHub matches
      # required_contexts against commit statuses only, not Actions check runs: tried on 2026-10-28,
      # a deployment requiring a check that had passed 30 times was refused (409) like one requiring
      # a check that does not exist.
      - name: Record the deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg ref "$TAG" '{
            ref: $ref, environment: "razorbill", auto_merge: false, required_contexts: [],
            description: ("zig-runner " + $ref)
          }' | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - \
            --jq '"deployment \(.id): \(.ref) to \(.environment)"'
