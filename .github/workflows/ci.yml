name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request on top of main and those queued before it; without
  # this its required checks never report.
  merge_group:

# Nothing by default; each job asks for what it needs.
permissions: {}

# Every job has a time limit well above how long it takes: without one, a hung job holds its runner
# for GitHub's default of six hours, and on prod that runner is the project's own.

# A pull request's new push replaces the run of its old one; main's runs all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The prefix decides the version a merge into main releases (README, "Versioning").
  branch:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            feature/?* | feat/?* | bugfix/?* | hotfix/?* | ci/?* | release/?* | docs/?* | perf/?* | refactor/?*) ;;
            renovate/?*) ;;
            *)
              echo "::error::'$BRANCH' needs one of the prefixes feature/, feat/, bugfix/, hotfix/, ci/, release/, docs/, perf/ or refactor/ (README, \"Versioning\")"
              exit 1
              ;;
          esac

  # The workflows themselves: actionlint for mistakes, zizmor for security; and the shell scripts
  # they and the deployment run, with shellcheck (README, "Pipeline").
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out the workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go's module proxy and checksum database verify what this downloads.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # The image is pinned by digest. deploy/zig-runner-deploy runs on prod every minute.
      - name: shellcheck
        run: .github/scripts/shellcheck.sh

      # install-zig.sh's tree check, on a small fake tree: the list of stat lines lets a job skip
      # re-reading unchanged files, never a changed, added or deleted one.
      - name: Zig tree check
        run: .github/scripts/zig-tree-check-test.sh

      # The changie the release installs, against its pinned checksum: a new version (Renovate's)
      # fails here until the checksum is updated, not at the release, after it was approved.
      - name: changie's checksum
        run: .github/scripts/install-changie.sh

      # The busybox the runner puts into job containers (runner/src/dagger.zig), pinned by digest:
      # checked to be a pullable multi-arch index (amd64 and arm64) with the applets Docker actions,
      # services and output keys use, so a Renovate busybox pull request, or a re-wrapped literal,
      # fails here, not on a runner. Docker Hub is asked anonymously from GitHub's shared addresses:
      # only a fetch that fails (exit 75) is tried again, twice, after a pause, as for zizmor.
      - name: busybox's pin
        run: |
          for attempt in 1 2 3; do
            status=0
            .github/scripts/busybox-pin.sh || status=$?
            ((status == 75 && attempt < 3)) || exit "$status"
            echo "::warning::busybox-pin.sh could not reach Docker Hub (attempt $attempt of 3): trying again"
            sleep $((attempt * 15))
          done

      # zizmor's online audits ask GitHub (its advisories, the pinned commits). A request that fails
      # makes zizmor exit 1, the code for its own failure, which once took a pull request out of
      # the merge queue (#194). Only that is tried again, twice, after a pause: findings (exit 10
      # to 14) and anything else fail at once, and the online audits run everywhere.
      - name: zizmor
        env:
          # Read-only; zizmor asks GitHub whether the pinned actions' commits are what they say.
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            status=0
            pipx run zizmor==1.31.1 --format github .github/workflows || status=$?
            ((status == 1 && attempt < 3)) || exit "$status"
            echo "::warning::zizmor could not run (exit 1; attempt $attempt of 3), most likely a failed request to GitHub: trying again"
            sleep $((attempt * 15))
          done

  # The database tests, which skip themselves without a database: here against TimescaleDB, as
  # deployments use, and required to run (ZIG_TEST_REQUIRE_DB), so this job cannot pass by skipping
  # them. On GitHub's runner. Every test runs here, so here they run under ThreadSanitizer, which
  # fails them on a data race. The database is started by a step, not as a service container, which
  # GitHub would start (about 25 s) before the first step: so it comes up while the tests compile,
  # and is waited for just before they run (ci-database.sh). Skipped, still reporting, on a change
  # that cannot affect the tests (ci-scope.sh).
  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to check out the code
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only
      PGDATABASE: tsdb
      PGSSLMODE: disable
      ZIG_TEST_REQUIRE_DB: "1"
      ZIG_TEST_SANITIZE_THREAD: "1"
      ZIG_TEST_WAIT_FOR_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the tests
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh tests

      - name: Start the database
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/ci-database.sh start

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      # Without `zig build`, whose first step here would be compiling Zig's build system (about
      # 100 s): this job's cache always starts empty (zig-test.sh).
      - name: Test, with the database
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/zig-test.sh

  # A push to main runs on prod, this project's own runner, so every merge exercises it; pull
  # requests and the merge queue run on GitHub's runner on purpose, cold every time, the worst case
  # for a build (README, "Environments"). The repository variables PROD_RUNNER and PREPROD_RUNNER
  # hold runs-on labels as JSON (["self-hosted","prod"]); PREPROD_RUNNER is left unset, and unset
  # means GitHub's runner.
  test:
    name: Format, build and test
    runs-on: ${{ fromJSON(github.event_name == 'push' && (vars.PROD_RUNNER || '"ubuntu-latest"') || (vars.PREPROD_RUNNER || '"ubuntu-latest"')) }}
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skipped, still reporting, on a change that cannot affect them (ci-scope.sh); never on main.
      - name: Whether this change can affect the build and tests
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh tests

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      # Named, not `.`: zig-pkg/ holds the dependencies once anything has built, in their own style.
      - name: Format check
        if: steps.scope.outputs.run == 'true'
        working-directory: runner
        run: zig fmt --check build.zig build.zig.zon src tools

      # runner/src/expr.zig against GitHub's own expression test cases (actions/languageservices):
      # fails on a case that broke, or on one that now passes and is still listed as failing.
      - name: Expressions against GitHub's test cases
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/expr-conformance.sh

      # The database tests skip themselves here: the Database tests job runs them. On GitHub's
      # runners, whose cache always starts empty, without `zig build` (zig-test.sh); on the
      # project's own, whose cache is kept, through it, as developers build.
      - name: Test
        if: steps.scope.outputs.run == 'true'
        working-directory: runner
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            ../.github/scripts/zig-test.sh
          else
            zig build test --summary all
          fi

  # The release's own builds, both targets in ReleaseSafe (build-binaries.sh), which nothing else
  # compiles before the tag: the tests build x86_64 in Debug, and release.yml's checks run only for
  # a change to the packaging. Code that compiles there and not for aarch64, or not in ReleaseSafe,
  # would otherwise fail first at the release, after the tag, which cannot be cut again. About a
  # minute, beside the Database tests' two. Skipped, still reporting, on a change that cannot
  # affect them (ci-scope.sh binaries); not on main, whose commits the merge queue built, and whose
  # tag's release builds them anyway.
  binaries:
    name: Release builds
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether this change can affect the release's builds
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .github/scripts/ci-scope.sh binaries

      - name: Install Zig
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/install-zig.sh

      - name: Build for x86_64 and aarch64
        if: steps.scope.outputs.run == 'true'
        run: .github/scripts/build-binaries.sh v0.0.0-ci "$RUNNER_TEMP/dist"
