name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  ZIG_VERSION: "0.17.0"

jobs:
  test:
    name: Format, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          arch=$(uname -m)
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${arch}-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C /opt
          echo "/opt/zig-${arch}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Format check
        working-directory: runner
        run: zig fmt --check .

      # The database tests skip themselves: no PG* variables are set here.
      - name: Test
        working-directory: runner
        run: zig build test --summary all
