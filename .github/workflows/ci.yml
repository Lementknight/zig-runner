name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  ZIG_VERSION: "0.17.0"

jobs:
  test:
    name: Format, build and test
    # This project's own runner (deploy/, a zig-runner registered to this repository), so every
    # push exercises it. The runner keeps RUNNER_TOOL_CACHE between jobs, so Zig downloads once.
    runs-on: [self-hosted, zig]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          arch=$(uname -m)
          dir="$RUNNER_TOOL_CACHE/zig/$ZIG_VERSION/$arch"
          if [ ! -x "$dir/zig" ]; then
            mkdir -p "$dir"
            curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${arch}-linux-${ZIG_VERSION}.tar.xz" \
              | tar -xJ -C "$dir" --strip-components=1
          fi
          echo "$dir" >> "$GITHUB_PATH"

      - name: Format check
        working-directory: runner
        run: zig fmt --check .

      # The database tests skip themselves: no PG* variables are set here.
      - name: Test
        working-directory: runner
        run: zig build test --summary all
